 eme_culture_divergence_notification.41.t:0 "Arrival of the Nubians"
 eme_culture_divergence_notification.41.desc:0 "Enabled by the turmoil in out country, migrations from the south have begun to irriversibly shift the culture and traditions spoken in our cities. These new inhabitants have come to meld and blend with those old citizens of Kush, to such an extent that our people have even begun to shift to this new tounge.\n\nThough many see this simply as a natural occurence with the passage of time, others long for a return to the old ways, fightling tooth and nail to maintain their old toungue and customs."
 eme_culture_divergence_notification.41.a:0 "This is simply the way things are"
