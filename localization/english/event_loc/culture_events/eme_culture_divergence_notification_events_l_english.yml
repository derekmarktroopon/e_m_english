l_english:

 


 eme_culture_divergence_notification.1.t:0 "Emergence of the Venetians"
 eme_culture_divergence_notification.1.desc:0 "As the generations have passed, the long-held traditions of the Romano-Veneti has transformed into something our ancestors would find unrecognisable. Across the vast scape of the Gallic world, such have been these changes that seldom can a Roman traveler now understand the tounge of their neighbours.\n\nThough many see this simply as the nature of the passage of time, others long for a return to the old ways, fightling tooth and nail to maintain their old toungue and customs."
 eme_culture_divergence_notification.1.a:0 "This is simply the way things are"
 eme_culture_divergence_notification.1.b:0 "No! We shall not forget our old ways!"

