l_english:

 
 eme_religious_decision_events.1.t:0 "Into the Christian Church"
 eme_religious_decision_events.1.desc:0 "Our faith had long been held to be one of pagan idolatry by outsiders, and it is true that some of our practices were unbecoming of the true will of [ROOT.Char.GetFaith.HighGodName], however all of this was simply preparation for the eventual reveal of Christ's treachings to our people, of which have fallen on purpousfully fertile ground, as per [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] teachings.\n\nWith [ROOT.Char.GetFaith.GetMainRite.GetHeadOfRite.GetTitledFirstName] blessing our entrance into the [ROOT.Char.GetFaith.GetAdjective] Chruch, we are now in communion with our fellow followers of Christ, ready to enact [ROOT.Char.GetFaith.HighGodNamePossessive] will on earth."
 eme_religious_decision_events.1.a:0 "Glorious!"

 eme_religious_decision_events.2.t:0 "Into the Christian Church"
 eme_religious_decision_events.2.desc:0 "Our faith had long been held to be one of pagan idolatry by outsiders, and it is true that some of our practices were unbecoming of the true will of [ROOT.Char.GetFaith.HighGodName], however all of this was simply preparation for the eventual reveal of Christ's treachings to our people, of which have fallen on purpousfully fertile ground, as per [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] teachings.\n\nWith [ROOT.Char.GetFaith.GetMainRite.GetHeadOfRite.GetTitledFirstName] blessing our entrance into the [ROOT.Char.GetFaith.GetAdjective] Chruch, we are now in communion with our fellow followers of Christ, ready to enact [ROOT.Char.GetFaith.HighGodNamePossessive] will on earth."
 eme_religious_decision_events.2.a:0 "Glorious!"

 eme_religious_decision_events.3.t:0 "Communion of the [pie_christianity.GetAdherentNamePlural]"
 eme_religious_decision_events.3.desc:0 "Those [pie_christianity.GetAdherentNamePlural], long of which had practiced pagan virtues and idolatry, had some time ago began to reform themselves. Steered course by the light of [ROOT.Char.GetFaith.HighGodNameAlternate] it seems as though [ROOT.Char.GetFaith.HighGodNamePossessive] true will for these people has been made clear to us now, for, led by [pie_christianity.GetHeadOfRite.GetTitledFirstName], they professed their desire to submit to my authority as [ROOT.Char.GetFaith.HighGodNamePossessive] emissary on Earth, willing also to align their practices and tenets with those compatible with those of the Church!\n\nAs is the teaching of Christ, #G 'If your enemy is hungry, give him bread to eat, and if he is thirsty, give him water to drink, for you will heap burning coals on his head, and the Lord will reward you'#!, and reward us the Lord has. "
 eme_religious_decision_events.3.a:0 "Glorious!"

