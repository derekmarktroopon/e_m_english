l_english:

  restore_ithaca_decision: "Restore Ithaca"
  restore_ithaca_decision_desc: "Long ago, in the days when gods walked the Earth and heroes fought great beasts, the small island of Ithaca was a great Hellenic kingdom, ruled by the legendary hero Odysseus. Though it has since fallen into irrelevance, the legend of Odysseus remains timeless.\n\nLet us restore that kingdom ruled by our famous forefathers and begin heroic exploits of our own!"
  restore_ithaca_decision_tooltip: "Ithaca will be created as its own Kingdom-Tier title."
  restore_ithaca_decision.preview.tt: "Restore the Kingdom of Ithaca"
  restore_ithaca_decision_confirm: "The Kings of Ithaca will be famed once again!"
