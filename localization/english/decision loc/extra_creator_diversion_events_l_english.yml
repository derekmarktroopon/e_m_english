l_english:

  emergence_of_the_galsianers: "Emergence of the Galsianers"
  emergence_of_the_galsianers_desc: "The Germanic peoples of the North Sea have chanced upon new lands in the upper Adriatic. Having intermarried with the local Venetians and gone through much of their historical documentation with great fascination, a natural push to meld these different cultures has arrisen."
  emergence_of_the_galsianers_confirm: "Hybridise with the Venetians"
  emergence_of_the_galsianers_tooltip: "The North-West Germanic cultures will hybridise with that of the Venetians."
  
  galsignan_culture_events.1.t: "Emergence of the Galsianers"
  galsignan_culture_events.1.desc: "Our people adore the beautiful cities of these lands, the music and the varied spoken toungues. From old ruins and monastic texts we see the history of this place, stemming far back beyond the Romans to the equine-inclined Venetkens. We must meld not only our Northern cultures with that of the locals, but make a revival of that old Pre-Roman legacy.\n\nThat being said, the great variety of cultures coalessing under us means that the various standards of writing names, once brought together, is becoming inconsistent and confusing when pronounciation is attempted. We may have to look into a new standardisation of our orthography."
  galsignan_culture_events.option_a: "Our varies spellings are a mark of history!"
  galsignan_culture_events.option_b: "We ought to devise a new orthography to unite this culture."