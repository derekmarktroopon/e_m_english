  synceticise_with_sinitic_world_pagan_rites_decision:0 "Integrate into the Sinitic World"
  synceticise_with_sinitic_world_pagan_rites_decision_desc:0 "In spite of our existing creed, these lands are rife with abundant philosophies and creeds, all coexisting in relative harmony. The balance evident within this society exemplifies a profound wisdom that is to be found in the philosophies of Confucious and Laozi. While those more conservative among us abhored these stange traditions at first, it is becoming ever more clear that there is no contradiction in adopting these in one hand, while also keeping our old beliefs in the other."
  synceticise_with_sinitic_world_requirement_tt:0 "At least #E 1#! " [head_of_faith|E] of a [main_rite|E] faith with the [GetDoctrineType('special_doctrine_immaterial_harmony').GetBaseName] doctrine has at least #G 50#! #E opinion#! of you."